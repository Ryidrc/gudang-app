<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ _("login.title") }} — {{ _("app.name") }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="card auth-card">
      <h1 class="auth-title">{{ _("app.name") }}</h1>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next }}">
        <label class="field">{{ _("login.username") }}
          <input type="text" name="username" autocomplete="username" required autofocus>
        </label>
        <label class="field">{{ _("login.password") }}
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary btn-block" type="submit">{{ _("login.submit") }}</button>
      </form>
    </div>
  </div>
</body>
</html>
