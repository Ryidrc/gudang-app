{% extends "base.html" %}
{% block content %}
<div class="no-print" style="margin-bottom: 1rem;">
  <h2>{{ _("qr.sheet_title") }}: {{ g.name }} / {{ a.name }}</h2>
  <button class="btn btn-primary" onclick="window.print()">{{ _("common.print") }}</button>
  <a class="btn" href="/w/area/{{ a.id }}">{{ _("common.back") }}</a>
</div>

<div class="qr-sheet">
  {% for r in raks %}
  <div class="qr-item">
    <img src="/w/rak/{{ r.id }}/qr" alt="QR Code for {{ r.name }}">
    <div class="qr-label">{{ r.name }}</div>
  </div>
  {% else %}
  <div class="card"><p>{{ _("w.empty") }}</p></div>
  {% endfor %}
</div>
{% endblock %}
